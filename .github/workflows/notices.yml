# Regenerates THIRD_PARTY_NOTICES.md and fails if it differs from the committed
# copy, so a dependency change cannot land without refreshed attribution.
#
# This runs on every build rather than behind a changed-paths filter. The
# runtime inventory is the import closure of ./cmd/..., so it changes when
# ordinary .go files change their imports, not only when go.mod or vendor/ move.
# A filter keyed on dependency manifests would therefore pass green while the
# committed file goes stale, and the failure would surface on main instead of on
# the pull request that caused it.

name: Notices

on:
  push:
    branches:
      - main
      - release-*
      - "pull-request/[0-9]+"

jobs:
  notices-check:
    name: Check third-party notices
    runs-on: linux-amd64-cpu4
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        name: Checkout code
      - name: Get Golang version
        id: vars
        run: |
          echo "GOLANG_VERSION=$(./hack/golang-version.sh)" >> "${GITHUB_ENV}"
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GOLANG_VERSION }}
      - name: Setup Go Proxy
        id: setup-go-proxy
        uses: nv-gha-runners/setup-artifactory-go-proxy@main
      - name: Verify THIRD_PARTY_NOTICES.md is up to date
        env:
          GOPROXY: ${{ steps.setup-go-proxy.outputs.goproxy-url }}
        run: make notices-check
