# NIM Cache for Model-Free NIM from Hugging Face Hub.
# The Operator downloads HF weights into the PVC. The same cache shape is used
# by Multi-LLM NIM and Model-Free NIM; modelPuller is the download image, not a
# lock to a serving container. Reference this cache from a NIMService with
# spec.storage.nimCache.name.
apiVersion: apps.nvidia.com/v1alpha1
kind: NIMCache
metadata:
  name: nim-cache-model-free
  namespace: nim-service
spec:
  source:
    hf:
      endpoint: "https://huggingface.co"
      namespace: "meta-llama"
      authSecret: hf-api-secret # secret must contain HF_TOKEN
      modelPuller: nvcr.io/nim/nvidia/model-free-nim:3.0.0
      pullSecret: ngc-secret
      modelName: "Llama-3.2-1B-Instruct"
  storage:
    pvc:
      create: true
      storageClass: ''
      size: "50Gi"
      volumeAccessMode: ReadWriteOnce
