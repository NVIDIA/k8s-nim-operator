# NIM Cache with Multi-LLM NIM from Hugging Face Hub.
# After the cache is Ready, reference it from a NIMService with
# spec.storage.nimCache.name (see serving/standalone/basic/multi-llm.yaml).
# For Model-Free NIM 3.0, use nimcache-model-free.yaml instead.
apiVersion: apps.nvidia.com/v1alpha1
kind: NIMCache
metadata:
  name: nim-cache-multi-llm
  namespace: nim-service
spec:
  source:
    hf:
      endpoint: "https://huggingface.co"
      namespace: "meta-llama"
      authSecret: hf-secret # with HF_TOKEN set
      modelPuller: nvcr.io/nim/nvidia/llm-nim:1.15.0
      pullSecret: ngc-secret
      modelName: "Llama-3.2-1B-Instruct"
  storage:
    pvc:
      create: true
      storageClass: ''
      size: "50Gi"
      volumeAccessMode: ReadWriteOnce
