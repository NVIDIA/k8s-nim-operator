---
# NIM Cache for Model-Free NIM (Hugging Face Hub weights).
apiVersion: apps.nvidia.com/v1alpha1
kind: NIMCache
metadata:
  name: nim-cache-model-free
  namespace: nim-service
spec:
  source:
    hf:
      endpoint: "https://huggingface.co"
      namespace: "meta-llama"
      authSecret: hf-api-secret # secret must contain HF_TOKEN
      modelPuller: nvcr.io/nim/nvidia/model-free-nim:3.0.0
      pullSecret: ngc-secret
      modelName: "Llama-3.2-1B-Instruct"
  storage:
    pvc:
      create: true
      storageClass: ''
      size: "50Gi"
      volumeAccessMode: ReadWriteOnce

---
# Model-Free NIM 3.0 on KServe Standard (raw deployment) mode.
apiVersion: apps.nvidia.com/v1alpha1
kind: NIMService
metadata:
  name: nim-service-model-free
  namespace: nim-service
spec:
  inferencePlatform: kserve
  annotations:
    serving.kserve.io/deploymentMode: 'Standard'
  labels:
    networking.kserve.io/visibility: "exposed"
  image:
    repository: nvcr.io/nim/nvidia/model-free-nim
    tag: "3.0.0"
    pullPolicy: IfNotPresent
    pullSecrets:
      - ngc-secret
  authSecret: hf-api-secret
  replicas: 1
  storage:
    nimCache:
      name: nim-cache-model-free
  resources:
    limits:
      nvidia.com/gpu: 1
      cpu: "12"
      memory: 32Gi
    requests:
      nvidia.com/gpu: 1
      cpu: "4"
      memory: 6Gi
  expose:
    service:
      type: ClusterIP
      port: 8000
