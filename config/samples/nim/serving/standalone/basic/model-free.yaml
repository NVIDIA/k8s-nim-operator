---
# NIM Cache for Model-Free NIM (Hugging Face Hub weights).
# Wait until this NIMCache is Ready before the NIMService will become available.
apiVersion: apps.nvidia.com/v1alpha1
kind: NIMCache
metadata:
  name: nim-cache-model-free
  namespace: nim-service
spec:
  source:
    hf:
      endpoint: "https://huggingface.co"
      namespace: "meta-llama"
      authSecret: hf-api-secret # secret must contain HF_TOKEN
      modelPuller: nvcr.io/nim/nvidia/model-free-nim:3.0.0
      pullSecret: ngc-secret
      modelName: "Llama-3.2-1B-Instruct"
  storage:
    pvc:
      create: true
      storageClass: ''
      size: "50Gi"
      volumeAccessMode: ReadWriteOnce

---
# NIMService for Model-Free NIM 3.0 serving the cached HF weights.
# The Operator injects NIM_MODEL_NAME, NIM_MODEL_PATH, and HF_HOME from the
# HF-backed NIMCache. Do not point this service at an NGC LLM-specific cache;
# those artifacts use a different on-disk layout.
apiVersion: apps.nvidia.com/v1alpha1
kind: NIMService
metadata:
  name: model-free-llama-3-2-1b-instruct
  namespace: nim-service
spec:
  image:
    repository: nvcr.io/nim/nvidia/model-free-nim
    tag: "3.0.0"
    pullPolicy: IfNotPresent
    pullSecrets:
      - ngc-secret
  authSecret: hf-api-secret
  storage:
    nimCache:
      name: nim-cache-model-free
  resources:
    limits:
      nvidia.com/gpu: 1
      cpu: "12"
      memory: 32Gi
    requests:
      nvidia.com/gpu: 1
      cpu: "4"
      memory: 6Gi
  replicas: 1
  expose:
    service:
      type: ClusterIP
      port: 8000
