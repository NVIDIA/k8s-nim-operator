---
# NIM Service using a hostPath volume instead of a PVC or NIMCache.
# Intended for single-node or proof-of-concept clusters. The directory must
# exist on the node with permissions the NIM user can write (typically chmod 777).
# On OpenShift also run: sudo chcon -Rt container_file_t /mnt/models/llama-3.2-1b-instruct
apiVersion: apps.nvidia.com/v1alpha1
kind: NIMService
metadata:
  name: meta-llama-3-2-1b-instruct-hostpath
  namespace: nim-service
spec:
  image:
    repository: nvcr.io/nim/meta/llama-3.2-1b-instruct
    tag: "1.12.0"
    pullPolicy: IfNotPresent
    pullSecrets:
      - ngc-secret
  authSecret: ngc-api-secret
  storage:
    hostPath: /mnt/models/llama-3.2-1b-instruct
  replicas: 1
  resources:
    limits:
      nvidia.com/gpu: 1
  expose:
    service:
      type: ClusterIP
      port: 8000
