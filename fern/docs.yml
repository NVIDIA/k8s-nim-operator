    destination: /nim-operator/dev/release-notes
  - source: /nim-operator/dev/entity-store
    destination: /nim-operator/dev/release-notes
  - source: /nim-operator/dev/customizer
    destination: /nim-operator/dev/release-notes
  - source: /nim-operator/dev/evaluator
    destination: /nim-operator/dev/release-notes
  - source: /nim-operator/dev/guardrail
    destination: /nim-operator/dev/release-notes
  - source: /nim-operator/dev/nemo-upgrade
    destination: /nim-operator/dev/release-notes
