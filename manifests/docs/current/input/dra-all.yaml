---
# NIMService using auto-generated ResourceClaimTemplate
apiVersion: apps.nvidia.com/v1alpha1
kind: NIMService
metadata:
  name: meta-llama3-8b-instruct
spec:
  image:
    repository: nvcr.io/nim/meta/llama-3.1-8b-instruct
    tag: "1.8.3"
    pullPolicy: IfNotPresent
    pullSecrets:
      - ngc-secret
  authSecret: ngc-api-secret
  storage:
    nimCache:
      name: meta-llama3-8b-instruct
      profile: ''
  replicas: 1
  draResources:
  - claimCreationSpec:
      devices:
      - name: gpu
        count: 1
        deviceClassName: gpu.nvidia.com
        driverName: gpu.nvidia.com
        attributeSelectors:
        - key: driverVersion
          op: GreaterThanOrEqual
          value:
            versionValue: "550.127.8"
        - key: architecture
          op: Equal
          value:
            stringValue: Ampere
        capacitySelectors:
        - key: memory
          op: GreaterThanOrEqual
          value: 40Gi
  expose:
    service:
      type: ClusterIP
      port: 8000
---
