# Full GPU resource claim
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
    name: gpu-claim
spec:
    devices:
      requests:
      - exactly:
          allocationMode: ExactCount
          count: 1
          deviceClassName: gpu.nvidia.com
        name: gpu
---
# MIG (1g.10gb) resource claim with time slicing strategy
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: mig-ts-claim
spec:
  devices:
    config:
    - requests:
      - mig
      opaque:
        driver: gpu.nvidia.com
        parameters:
          apiVersion: resource.nvidia.com/v1beta1
          kind: MigDeviceConfig
          sharing:
            strategy: TimeSlicing
    requests:
    - exactly:
        allocationMode: ExactCount
        count: 1
        deviceClassName: mig.nvidia.com
        selectors:
        - cel:
            expression: "device.attributes['gpu.nvidia.com'].profile == '1g.10gb'"
      name: mig
---
# MIG (1g.10g) resource claim with MPS strategy
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: mig-mps-claim
spec:
  devices:
    config:
    - requests:
      - mig
      opaque:
        driver: gpu.nvidia.com
        parameters:
          apiVersion: resource.nvidia.com/v1beta1
          kind: MigDeviceConfig
          sharing:
            strategy: MPS
    requests:
    - exactly:
        allocationMode: ExactCount
        count: 1
        deviceClassName: mig.nvidia.com
        selectors:
        - cel:
            expression: "device.attributes['gpu.nvidia.com'].profile == '1g.10gb'"
      name: mig
---
# NIMService with a 1-GPU resource claim and a NIMCache with tp=1 model profiles
apiVersion: apps.nvidia.com/v1alpha1
kind: NIMService
metadata:
  name: meta-llama-31-8b-instruct
spec:
  image:
      repository: nvcr.io/nim/meta/llama-3.1-8b-instruct
      tag: 1.8.3
      pullPolicy: IfNotPresent
      pullSecrets:
        - ngc-secret
  authSecret: ngc-api-secret
  storage:
      nimCache:
        name: meta-llama-31-8b-instruct
        profile: ''
  replicas: 1
  draResources:
  - resourceClaimName: gpu-claim
  expose:
      service:
        type: ClusterIP
        port: 8000
---
