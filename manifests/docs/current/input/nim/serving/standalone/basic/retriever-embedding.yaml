---
# NIM Cache for NVIDIA NeMo Retriever Embedding NIM 2.0.0
apiVersion: apps.nvidia.com/v1alpha1
kind: NIMCache
metadata:
  name: llama-nemotron-embed-vl-1b-v2
  namespace: nim-service
spec:
  source:
    ngc:
      modelPuller: nvcr.io/nim/nvidia/llama-nemotron-embed-vl-1b-v2:2.0.0
      pullSecret: ngc-secret
      authSecret: hf-api-secret
  storage:
    pvc:
      create: true
      storageClass: ""
      size: "50Gi"
      volumeAccessMode: ReadWriteOnce

---
# NIM Service for NVIDIA NeMo Retriever Embedding NIM 2.0.0
apiVersion: apps.nvidia.com/v1alpha1
kind: NIMService
metadata:
  name: llama-nemotron-embed-vl-1b-v2
  namespace: nim-service
spec:
  image:
    repository: nvcr.io/nim/nvidia/llama-nemotron-embed-vl-1b-v2
    tag: "2.0.0"
    pullPolicy: IfNotPresent
    pullSecrets:
      - ngc-secret
  authSecret: hf-api-secret
  storage:
    nimCache:
      name: llama-nemotron-embed-vl-1b-v2
  replicas: 1
  resources:
    limits:
      nvidia.com/gpu: 1
  expose:
    service:
      type: ClusterIP
      port: 8000
