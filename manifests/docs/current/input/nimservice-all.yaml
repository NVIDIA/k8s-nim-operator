# NIMService for Multi-LLM HF without pre-caching
apiVersion: apps.nvidia.com/v1alpha1
kind: NIMService
metadata:
  name: hf-nim-service-no-cache
spec:
  image:
    repository: nvcr.io/nim/nvidia/llm-nim
    tag: "1.12"
    pullPolicy: IfNotPresent
    pullSecrets:
      - ngc-secret
  authSecret: hf-secret # Secret must contain HF_TOKEN key
  env:
    - name: NIM_MODEL_NAME
      value: hf://meta-llama/Llama-3.2-1B-Instruct
  storage:
    pvc:
      create: true
      storageClass: ''
      size: 10Gi
      volumeAccessMode: ReadWriteOnce
  resources:
    limits:
      nvidia.com/gpu: 1
      cpu: "12"
      memory: 32Gi
    requests:
      nvidia.com/gpu: 1
      cpu: "4"
      memory: 6Gi
  replicas: 1
  expose:
    service:
      type: ClusterIP
      port: 8000
---
