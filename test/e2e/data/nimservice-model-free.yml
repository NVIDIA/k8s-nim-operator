apiVersion: apps.nvidia.com/v1alpha1
kind: NIMService
metadata:
  name: model-free-llama-3-2-1b-instruct
spec:
  image:
    repository: nvcr.io/nim/nvidia/model-free-nim
    tag: "3.0.0"
    pullPolicy: IfNotPresent
    pullSecrets:
      - ngc-secret
  authSecret: hf-token-secret
  storage:
    nimCache:
      name: nim-cache-model-free
  resources:
    limits:
      nvidia.com/gpu: 1
      cpu: "12"
      memory: 32Gi
    requests:
      nvidia.com/gpu: 1
      cpu: "4"
      memory: 6Gi
  replicas: 1
  expose:
    service:
      type: ClusterIP
      port: 8000
